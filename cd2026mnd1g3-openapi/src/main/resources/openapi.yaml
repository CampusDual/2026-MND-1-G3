openapi: 3.1.0
info:
  title: VetControl B2B
  version: 2.0.0
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
paths:
  /api/explotaciones:
    get:
      responses:
        '200':
          description: Explotaciones
    post:
      responses:
        '201': {description: Creada}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/ganaderia/animales:
    get:
      responses:
        '200': {description: Animales}
    post:
      responses:
        '201': {description: Creado}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/ganaderia/animales/{animalId}/estado:
    post:
      parameters:
        - {name: animalId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: estado, in: query, required: true, schema: {$ref: '#/components/schemas/EstadoSanitario'}}
      responses:
        '204': {description: Estado actualizado}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/protocolos-ciclicos:
    post:
      responses:
        '201': {description: Protocolo registrado}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/alertas:
    get:
      responses:
        '200': {description: Alertas internas}
  /api/alertas/{id}/leida:
    post:
      responses:
        '200': {description: Alerta marcada}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/alertas/{id}/confirmar-granja:
    post:
      responses:
        '200': {description: Confirmada por granja}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/inventario/medicamentos:
    get:
      responses:
        '200': {description: Medicamentos}
  /api/inventario/lotes:
    get:
      responses:
        '200': {description: Lotes de stock}
  /api/inventario/movimientos:
    get:
      responses:
        '200': {description: Ledger}
    post:
      responses:
        '200': {description: Movimiento registrado}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    basicAuth: {type: http, scheme: basic}
  responses:
    BadRequest: {description: Datos invalidos}
    Unauthorized: {description: No autenticado}
    Forbidden: {description: Acceso denegado por pertenencia o rol}
    NotFound: {description: Recurso no encontrado}
    Conflict: {description: Conflicto de estado}
    Unprocessable: {description: Entidad semanticamente invalida}
    InternalServer: {description: Error interno}
  schemas:
    AlertaSistema:
      type: object
      required: [clinicaId, destinatarioRol, tipoAlerta, titulo, mensaje, fechaProgramada]
      properties:
        id: {type: integer, format: int64}
        clinicaId: {type: integer, format: int64}
        destinatarioRol: {type: string, enum: [VETERINARIAN, FARM_MANAGER, CLINIC_ADMIN]}
        tipoAlerta: {type: string, enum: [RECORDATORIO_CICLICO, FIN_RETIRADA_MEDICAMENTO, URGENCIA_ANIMAL_ENFERMO, STOCK_BAJO]}
        titulo: {type: string, maxLength: 150}
        mensaje: {type: string, maxLength: 1000}
        fechaProgramada: {type: string, format: date-time}
        leida: {type: boolean}
        confirmadaPorGranja: {type: boolean}
        explotacionId: {type: integer, format: int64, nullable: true}
        animalId: {type: integer, format: int64, nullable: true}
    Medicamento:
      type: object
      required: [clinicaId, nombreComercial, principioActivo, especieDestino, categoriaPran, diasRetiradaDefecto, stockMinimoAlerta]
      properties:
        id: {type: integer, format: int64}
        clinicaId: {type: integer, format: int64}
        nombreComercial: {type: string, maxLength: 150}
        principioActivo: {type: string, maxLength: 150}
        especieDestino: {type: string, maxLength: 30}
        categoriaPran: {type: string, enum: [A, B, C, D]}
        diasRetiradaDefecto: {type: integer, minimum: 0}
        stockMinimoAlerta: {type: number, minimum: 0}
    MovimientoInventario:
      type: object
      properties:
        id: {type: integer, format: int64}
        clinicaId: {type: integer, format: int64}
        loteStockId: {type: integer, format: int64}
        tipoMovimiento: {type: string, enum: [ENTRADA_COMPRA, SALIDA_GANADERIA, SALIDA_CLINICA, MERMA_CADUCIDAD, AJUSTE_ANULACION]}
        cantidad: {type: number}
        fechaHora: {type: string, format: date-time}
        veterinarioId: {type: integer, format: int64, nullable: true}
        animalId: {type: integer, format: int64, nullable: true}
        explotacionId: {type: integer, format: int64, nullable: true}
        protocoloEventoId: {type: integer, format: int64, nullable: true}
    EstadoSanitario:
      type: string
      enum: [SANO, ENFERMO, CUARENTENA, EN_RETIRADA_MEDICAMENTO, TRATAMIENTO_FINALIZADO]
