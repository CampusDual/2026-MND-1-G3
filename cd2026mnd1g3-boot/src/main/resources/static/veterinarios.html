<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VetControl · Veterinarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">VetControl</a>
      <div class="navbar-nav">
        <a class="nav-link" href="granja.html">Granjas</a>
        <a class="nav-link active" href="veterinarios.html">Veterinarios</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="h2 mb-1">Portal de veterinarios</h1>
        <p class="text-secondary mb-0">Profesionales registrados y disponibilidad en la plataforma.</p>
      </div>
      <button id="refreshButton" class="btn btn-outline-primary">Actualizar datos</button>
    </div>
    <div id="feedback" class="alert d-none" role="alert"></div>

    <section class="card shadow-sm">
      <div class="card-header bg-white">
        <h2 class="h5 mb-0">Veterinarios registrados</h2>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr><th>Usuario</th><th>Rol</th><th>Estado</th></tr>
          </thead>
          <tbody id="veterinariansTable">
            <tr><td colspan="3" class="text-center text-secondary py-4">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const api = '/api';
    const feedback = document.getElementById('feedback');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[character]);
    const showMessage = (message, type = 'success') => {
      feedback.textContent = message;
      feedback.className = `alert alert-${type}`;
    };
    const request = async (path, options = {}) => {
      const response = await fetch(`${api}${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.status === 204 ? null : response.json();
    };
    const renderVeterinarians = users => {
      const veterinarians = users.filter(user => (user.roles || []).some(role =>
        role === 'VETERINARIAN' || role === 'ROLE_VETERINARIAN'));
      document.getElementById('veterinariansTable').innerHTML = veterinarians.map(user => `
        <tr>
          <td><strong>${escapeHtml(user.username)}</strong></td>
          <td><span class="badge text-bg-info">Veterinario</span></td>
          <td><span class="badge ${user.enabled ? 'text-bg-success' : 'text-bg-secondary'}">${user.enabled ? 'Activo' : 'Inactivo'}</span></td>
        </tr>`).join('') || '<tr><td colspan="3" class="text-center py-4">No hay veterinarios registrados.</td></tr>';
    };
    const load = async () => {
      try {
        renderVeterinarians(await request('/users'));
      } catch (error) {
        showMessage('No se pudieron cargar los veterinarios. Comprueba que el backend esté disponible.', 'danger');
      }
    };
    document.getElementById('refreshButton').addEventListener('click', load);
    load();
  </script>
</body>
</html>
