<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VetControl · Granjas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-success navbar-dark"><div class="container">
    <a class="navbar-brand fw-bold" href="index.html">VetControl</a>
    <div class="navbar-nav"><a class="nav-link" href="clinica.html">Clínicas</a><a class="nav-link active" href="granja.html">Granjas</a></div>
  </div></nav>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div><h1 class="h2 mb-1">Portal de granjas ganaderas</h1><p class="text-secondary mb-0">Explotaciones, ganado y alertas sanitarias.</p></div>
      <button id="refreshButton" class="btn btn-outline-success">Actualizar datos</button>
    </div>
    <div id="feedback" class="alert d-none" role="alert"></div>
    <div class="row g-4">
      <section class="col-lg-4"><div class="card shadow-sm">
        <div class="card-header bg-white"><h2 class="h5 mb-0">Explotaciones registradas</h2></div>
        <div id="farmsList" class="list-group list-group-flush"><div class="p-3 text-secondary">Cargando...</div></div>
      </div></section>
      <section class="col-lg-8"><div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <h2 class="h5 mb-0">Cabezas identificadas por crotal</h2>
          <select id="farmFilter" class="form-select form-select-sm w-auto" aria-label="Filtrar por explotación"><option value="">Todas</option></select>
        </div>
        <div class="table-responsive"><table class="table table-hover align-middle mb-0">
          <thead><tr><th>Crotal</th><th>Nombre</th><th>Explotación</th><th>Estado</th><th>Cambiar estado</th></tr></thead>
          <tbody id="animalsTable"><tr><td colspan="5" class="text-center py-4">Cargando...</td></tr></tbody>
        </table></div>
      </div></section>
    </div>
  </main>
  <script>
    const api = '/api';
    const state = { farms: [], animals: [] };
    const feedback = document.getElementById('feedback');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[character]);
    const showMessage = (message, type = 'success') => { feedback.textContent = message; feedback.className = `alert alert-${type}`; };
    const request = async (path, options = {}) => {
      const response = await fetch(`${api}${path}`, { headers: { 'Content-Type': 'application/json' }, ...options });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.status === 204 ? null : response.json();
    };
    const farmName = id => state.farms.find(farm => farm.id === id)?.name || 'Sin explotación';
    const healthLabel = status => ({ SANO: 'Sano', ENFERMO: 'Enfermo', CUARENTENA: 'Cuarentena' }[status] || status || 'Sin estado');
    const badgeClass = status => status === 'ENFERMO' ? 'text-bg-danger' : status === 'CUARENTENA' ? 'text-bg-warning' : 'text-bg-success';
    const load = async () => {
      try { [state.farms, state.animals] = await Promise.all([request('/explotaciones'), request('/animales')]); renderFarms(); renderAnimals(); }
      catch (error) { showMessage('No se pudieron cargar los datos de las granjas.', 'danger'); }
    };
    const renderFarms = () => {
      document.getElementById('farmsList').innerHTML = state.farms.map(farm => `<div class="list-group-item"><strong>${escapeHtml(farm.name)}</strong><small class="d-block text-secondary">${escapeHtml(farm.regaCode)} · ${escapeHtml(farm.mainSpecies)}</small></div>`).join('') || '<div class="p-3 text-secondary">Sin explotaciones.</div>';
      document.getElementById('farmFilter').innerHTML = '<option value="">Todas</option>' + state.farms.map(farm => `<option value="${escapeHtml(farm.id)}">${escapeHtml(farm.name)}</option>`).join('');
    };
    const renderAnimals = () => {
      const farmId = document.getElementById('farmFilter').value;
      const animals = state.animals.filter(animal => !farmId || String(animal.farmId) === farmId);
      document.getElementById('animalsTable').innerHTML = animals.map(animal => {
        const status = animal.estadoSanitario || (animal.healthStatus === 'SICK' ? 'ENFERMO' : animal.healthStatus === 'QUARANTINE' ? 'CUARENTENA' : 'SANO');
        return `<tr><td><strong>${escapeHtml(animal.earTag)}</strong></td><td>${escapeHtml(animal.name || '—')}</td><td>${escapeHtml(farmName(animal.farmId))}</td><td><span class="badge ${badgeClass(status)}">${escapeHtml(healthLabel(status))}</span></td><td><select class="form-select form-select-sm status-select" data-id="${escapeHtml(animal.id)}" aria-label="Estado de ${escapeHtml(animal.earTag)}"><option value="SANO">Sano</option><option value="ENFERMO">Enfermo</option><option value="CUARENTENA">Cuarentena</option></select></td></tr>`;
      }).join('') || '<tr><td colspan="5" class="text-center py-4">Sin animales para este filtro.</td></tr>';
      document.querySelectorAll('.status-select').forEach(select => { select.value = state.animals.find(animal => String(animal.id) === select.dataset.id)?.estadoSanitario || 'SANO'; select.addEventListener('change', updateStatus); });
    };
    const updateStatus = async event => {
      const select = event.currentTarget;
      const status = select.value;
      try {
        const params = new URLSearchParams({ estado: status, notas: 'Estado actualizado desde el portal de granjas.' });
        await request(`/protocolos-ciclicos/animales/${encodeURIComponent(select.dataset.id)}/estado?${params.toString()}`, { method: 'POST' });
        showMessage(status === 'ENFERMO' ? 'Estado actualizado y veterinario notificado.' : 'Estado sanitario actualizado.');
        await load();
      } catch (error) { showMessage('No se pudo actualizar el estado sanitario.', 'danger'); }
    };
    document.getElementById('farmFilter').addEventListener('change', renderAnimals);
    document.getElementById('refreshButton').addEventListener('click', load);
    load();
  </script>
</body>
</html>
